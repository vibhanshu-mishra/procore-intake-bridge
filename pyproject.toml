[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procore-intake-bridge"
version = "0.1.0"
description = "Read-only DMSA intake service for Procore RFIs and Submittals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "pyprocore>=2.1,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8"]
aws-secrets = ["boto3>=1.35,<2"]
azure-secrets = ["azure-identity>=1.19,<2", "azure-keyvault-secrets>=4.9,<5"]
gcp-secrets = ["google-cloud-secret-manager>=2.21,<3"]
cloud-secrets = [
  "boto3>=1.35,<2",
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "google-cloud-secret-manager>=2.21,<3",
]
s3-storage = ["boto3>=1.35,<2"]
azure-blob-storage = ["azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13"]
gcs-storage = ["google-cloud-storage>=2.19,<4"]
cloud-storage = [
  "boto3>=1.35,<2",
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "google-cloud-storage>=2.19,<4",
]
postgres = ["psycopg>=3.2,<4"]
postgres-binary = ["psycopg[binary]>=3.2,<4"]
db-ops = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
