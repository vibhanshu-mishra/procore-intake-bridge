
name: OpenQodex Code Review

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: Security and Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan changed code
        uses: openqodex/openqodex@736fd1484a05ead753375f52232bcf9e70f84246 # v0
        with:
          review: off
          upload-sarif: 'false'
          fail-on-tool-error: true
